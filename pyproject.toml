[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tapestry-osint"
version = "0.1.0"
description = "A custom OSINT aggregator that pulls and correlates data from multiple public sources into a single, correlated report."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "click",
    "dnspython",
    "python-whois",
    "jinja2",
    "pyfiglet",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
tapestry = "osint_aggregator.cli:recon"

[tool.setuptools.packages.find]
include = ["osint_aggregator*"]

[tool.setuptools.package-data]
osint_aggregator = ["templates/*.j2", "sites.json"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]